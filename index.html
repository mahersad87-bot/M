body{background:linear-gradient(180deg,var(--sky) 0,var(--bg) 340px) no-repeat;font-family:Tajawal,Tahoma,Arial,sans-serif}

/* ===== v7.4 attendance header ===== */

.dnav{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;margin-bottom:10px}

.dpk{position:relative;display:flex;align-items:center;justify-content:center;gap:9px;height:48px;border-radius:16px;background:var(--sky);border:1.5px solid var(--fb);font-weight:800;color:var(--bl2);overflow:hidden}

.dpk input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}

.xq{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;padding:0;border-radius:50%;align-items:center;justify-content:center;border:0;background:var(--sky);box-shadow:none;color:var(--mut)}
.xq .ic{width:15px;height:15px;margin:0}
.allb{display:flex;align-items:center;gap:6px;padding:0 16px;border:0;border-radius:18px;color:#fff;font-weight:800;font-size:14px;background:linear-gradient(135deg,#22b26a,#0f7a45);box-shadow:0 8px 18px rgba(20,128,74,.35)}
.allb .ic{width:19px;height:19px;margin:0;stroke:#fff}
.allb:active{transform:scale(.93)}
.pbar{margin:2px 0 10px}
.pbar:empty{display:none}
.pb{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--sky);border:1px solid var(--fb)}

.pb .s1{background:linear-gradient(90deg,#22b26a,#14804a)}.pb .s2{background:linear-gradient(90deg,#e8503f,#c2331f)}.pb .s3{background:linear-gradient(90deg,#f0b400,#d99a00)}

#cnt{gap:8px;margin:6px 0 12px}

#cnt .cn .ic{width:19px;height:19px}
#cnt .cn:active{transform:scale(.93)}
#cnt .cn.on{box-shadow:0 0 0 3px color-mix(in srgb,currentColor 25%,transparent),0 8px 16px -6px currentColor;transform:translateY(-2px)}

.hint{display:flex;gap:10px;align-items:flex-start;margin-top:10px;padding:10px 12px;border-radius:16px;background:var(--sky);border:1px solid var(--fb);font-size:12.5px;line-height:1.8;color:var(--mut);font-weight:600}
.hint .ic{width:20px;height:20px;margin:2px 0 0;flex:none;stroke:#e8780c}

/* ===== v7.5 section dropdown ===== */
#sg{position:relative;z-index:7}
.dd{position:relative;flex:1 1 100%;min-width:0}
.ddb{width:100%;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 12px;border-radius:20px;text-align:start;background:var(--cd);transition:box-shadow .2s,transform .15s,border-color .2s}

.ddc{font-style:normal;font-size:22px;line-height:1;color:var(--bl);transition:transform .3s cubic-bezier(.2,.9,.3,1.3)}

.ddm{position:absolute;top:calc(100% + 8px);inset-inline:0;max-height:min(55vh,340px);overflow:auto;padding:6px;border-radius:22px;background:var(--cd);border:1.5px solid var(--fb);box-shadow:0 18px 40px rgba(var(--rgb),.28);visibility:hidden;opacity:0;transform:translateY(-10px) scale(.97);transform-origin:top center;transition:opacity .22s,transform .28s cubic-bezier(.2,.9,.3,1.2),visibility 0s .28s}
.dd.open .ddm{visibility:visible;opacity:1;transform:none;transition:opacity .22s,transform .28s cubic-bezier(.2,.9,.3,1.2)}
.ddo{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;margin:0 0 4px;border:0!important;border-radius:16px;background:transparent!important;box-shadow:none!important;color:var(--tx);font-weight:700;text-align:start;opacity:0;transform:translateX(10px);transition:background .2s,transform .2s}
.dd.open .ddo{opacity:1;transform:none;transition:opacity .25s calc(var(--i)*35ms),transform .3s calc(var(--i)*35ms) cubic-bezier(.2,.9,.3,1.2),background .2s}
.ddo:last-child{margin:0}
.ddo:active{background:var(--sky)!important}
.ddo .ddl{flex:1}
.ddo .ddk{flex:none;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--fb);color:transparent;transition:background .2s,border-color .2s,transform .3s cubic-bezier(.2,.9,.3,1.6)}
.ddo .ddk .ic{width:15px;height:15px;margin:0;stroke:#fff}
.ddo.on{background:color-mix(in srgb,var(--bl) 10%,var(--cd))!important;color:var(--bl2)}
.ddo.on .ddk{background:var(--bl);border-color:var(--bl);transform:scale(1.1)}
.ahd .at b{font-size:17px;white-space:nowrap}
.tdy{padding:8px 12px}

/* v7.5b robust dropdown */
.ddm{position:fixed!important;inset-inline:auto!important;z-index:9;right:auto}
.ddbk{display:none;position:fixed;inset:0;z-index:8;background:rgba(15,31,92,.18);backdrop-filter:blur(1.5px)}
.dd.open .ddbk{display:block}

/* v7.5c body-level dropdown */
#ddl{display:none;position:fixed;inset:0;z-index:30;background:rgba(15,31,92,.2)}

#ddp.open{visibility:visible;opacity:1;transform:none;transition:opacity .22s,transform .28s cubic-bezier(.2,.9,.3,1.2)}

(function(){

document.body.style.overflow='hidden';
function rs(){W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr}rs();addEventListener('resize',rs);
function amb(){return{x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3*dpr,vy:-(.2+Math.random()*.6)*dpr,r:(Math.random()*2+.8)*dpr,a:Math.random()*.6+.25,l:0}}

for(var i=0;i<70;i++)P.push(amb());
function fr(){if(!run)return;cx.clearRect(0,0,W,H);cx.globalCompositeOperation='lighter';
for(var i=P.length-1;i>=0;i--){var p=P[i];
if(!p.l){var dx=p.x-mx*dpr,dy=p.y-my*dpr,d=Math.sqrt(dx*dx+dy*dy)||1;if(d<130*dpr){p.x+=dx/d*2.5;p.y+=dy/d*2.5}if(p.y<-10)p.y=H+10;if(p.x<0)p.x=W;if(p.x>W)p.x=0}
else{p.vx*=.95;p.vy*=.95;p.l-=.02;if(p.l<=0){P.splice(i,1);continue}}
p.x+=p.vx;p.y+=p.vy;
cx.fillStyle='rgba(246,200,90,'+(p.l?p.l:p.a)+')';cx.beginPath();cx.arc(p.x,p.y,p.r*(p.l?1+p.l:1),0,6.283);cx.fill()}

hd.addEventListener('pointerdown',function(e){dg=1;sx=e.clientX;mxw=tr.offsetWidth-hd.offsetWidth-10;hd.setPointerCapture(e.pointerId);tr.classList.add('dr');e.stopPropagation()});
hd.addEventListener('pointermove',function(e){if(dg){set(Math.max(0,Math.min(1,(sx-e.clientX)/mxw)));if(navigator.vibrate&&pr>.5&&pr<.53)navigator.vibrate(8)}});
function up(){if(!dg)return;dg=0;tr.classList.remove('dr');if(pr>.82){set(1);go()}else if(pr<.03){burst(hd.getBoundingClientRect().left+27,hd.getBoundingClientRect().top+27,16);set(.18);setTimeout(function(){set(0)},260)}else set(0)}
